send_sms:
  name: Send SMS
  description: Send an SMS using the router's SMS functionality.
  fields:
    phone_number:
      name: Phone number
      description: Destination phone number including country code (e.g. +441234567890)
      required: true
      example: "+441234567890"
      selector:
        text:
    message:
      name: Message
      description: Text message to send
      required: true
      example: "Hello from Home Assistant"
      selector:
        text:
          multiline: true
    entry_id:
      name: Config entry ID
      description: Optional config entry id to target a specific router instance
      required: false
      example: "abcd1234"
      selector:
        text:

reboot_router:
  name: Reboot router
  description: Reboot the router via the LuCI web UI.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry id to target a specific router instance
      required: false
      example: "abcd1234"
      selector:
        text:

restart_5g_connection:
  name: Restart 5G connection
  description: Restart the router's 5G modem/connection.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry id to target a specific router instance
      required: false
      example: "abcd1234"
      selector:
        text:

switch_5g_band:
  name: Switch 5G band
  description: Change the 5G band setting on the router.
  fields:
    band:
      name: Band
      description: Band value to select (depends on router)
      required: true
      example: "B3"
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: Optional config entry id to target a specific router instance
      required: false
      example: "abcd1234"
      selector:
        text:

send_at_command:
  name: Send AT command
  description: Send an AT command to the modem via the router's web UI. The result will be logged.
  fields:
    command:
      name: AT Command
      description: The AT command to send (e.g. AT+CSQ)
      required: true
      example: "AT+CSQ"
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: Optional config entry id to target a specific router instance
      required: false
      example: "abcd1234"
      selector:
        text:

generate_debug_report:
  name: Generate debug report
  description: Create a redacted Cudy Router debug report for troubleshooting WAN and VPN entity issues.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry id to target a specific router instance
      required: false
      example: "abcd1234"
      selector:
        text:
    include_html:
      name: Include HTML
      description: Include redacted HTML snippets from each tested router page.
      required: false
      default: true
      selector:
        boolean:
    max_html_chars:
      name: Maximum HTML characters
      description: Maximum redacted HTML characters to include for each tested router page.
      required: false
      default: 3000
      selector:
        number:
          min: 0
          max: 20000
          mode: box

get_sms:
  name: Get SMS
  description: Read SMS messages with their full text, for use in automations. Returns the messages as a response.
  fields:
    folder:
      name: Folder
      description: Which mailbox to read.
      required: false
      default: inbox
      selector:
        select:
          options:
            - inbox
            - outbox
            - all
    unread_only:
      name: Unread only
      description: Only return inbox messages the router still marks as unread.
      required: false
      default: false
      selector:
        boolean:
    entry_id:
      name: Config entry ID
      description: Optional config entry id to target a specific router instance
      required: false
      example: "abcd1234"
      selector:
        text:

delete_sms:
  name: Delete SMS
  description: Delete one or more SMS messages from the router by their cfg id.
  fields:
    cfg:
      name: Message id
      description: The cfg id of the message (as returned by get_sms or the SMS received event). A list deletes several.
      required: true
      example: "cfg10a53f"
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: Optional config entry id to target a specific router instance
      required: false
      example: "abcd1234"
      selector:
        text:
